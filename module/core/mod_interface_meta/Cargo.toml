[package]
name = "mod_interface_meta"
version = "0.65.1"
edition = "2021"
authors = [
  "Kostiantyn Mysnyk <wandalen@obox.systems>",
  "Dmytro Kryvoruchko <dmytro.kr@obox.systems>",
]
license = "MIT"
readme = "readme.md"
documentation = "https://docs.rs/mod_interface_meta"
repository = "https://github.com/Wandalen/wTools/tree/master/module/core/mod_interface_meta"
homepage = "https://github.com/Wandalen/wTools/tree/master/module/core/mod_interface_meta"
description = """
Protocol of modularity unifying interface of a module and introducing layers.
"""
categories = [ "algorithms", "development-tools" ]
keywords = [ "fundamental", "general-purpose", "builder-pattern" ]

[lints]
workspace = true

[package.metadata.docs.rs]
features = [ "full" ]
all-features = false


include = [
  "/rust/impl/meta/mod_interface_meta_lib.rs",
  "/rust/impl/meta/mod_interface/meta",
  "/Cargo.toml",
  "/readme.md",
  "/License",
]

[features]
default = [ "enabled" ]
full = [ "enabled" ]
enabled = []

[lib]
proc-macro = true

[dependencies]
# Features must be declared explicitly: [workspace.dependencies] sets default-features = false,
# so a bare `{ workspace = true }` inherits nothing. That built fine in the workspace only
# because sibling members enabled these features and cargo unified them — a packaged or
# standalone build applies this crate's own declaration alone, leaving `macro_tools::exposed`
# and `macro_tools::prelude` (both gated on "enabled") absent and failing `cargo package`
# verification with 64 unresolved imports.
#   enabled — the own/orphan/exposed/prelude namespaces, plus `qt`, `parse_qt`, `syn`, `Token`
#   attr    — `AttributesInner`/`AttributesOuter`; transitively pulls in
#             `diag` (`syn_err`, `code_to_str`, `err`) and
#             `quantifier` (`Pair`, `Many`, `AsMuchAsPossibleNoDelimiter`)
macro_tools = { workspace = true, features = [ "enabled", "attr" ] }
derive_tools = { workspace = true, features = [ "enabled", "derive_is_variant" ] }

[dev-dependencies]
test_tools = { workspace = true, features = [ "full" ] }
