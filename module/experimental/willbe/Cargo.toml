# module/experimental/willbe/Cargo.toml
[package]
name = "willbe"
version = "0.42.1"
edition = "2021"
authors = [
  "Kostiantyn Mysnyk <wandalen@obox.systems>",
  "Dmytro Kryvoruchko <dmytro.kr@obox.systems>",
]
license = "MIT"
readme = "readme.md"
documentation = "https://docs.rs/willbe"
repository = "https://github.com/Wandalen/wTools/tree/master/module/experimental/willbe"
homepage = "https://github.com/Wandalen/wTools/tree/master/module/experimental/willbe"
description = """
Utility to publish multi-crate and multi-workspace environments and maintain their consistency.
"""
categories = [ "algorithms", "development-tools" ]
keywords = [ "fundamental", "general-purpose" ]
default-run = "will"

[lints]
workspace = true

[package.metadata.docs.rs]
features = [ "full" ]
all-features = false

[features]
default = [
  "enabled",
  "progress_bar",
]
full = [
  "enabled",
  "progress_bar",
]
enabled = [
  "crates_tools/enabled",
  "error_tools/enabled",
  "former/enabled",
  "mod_interface/enabled",
  "wca/enabled",
  "pth/enabled",
  "process_tools/enabled",
  "collection_tools/enabled",
  "macro_tools/enabled",
]

tracing = [ "dep:tracing", "dep:tracing-subscriber" ]
progress_bar = [ "dep:indicatif" ]

[dependencies]

## external
cargo_metadata = { workspace = true }
convert_case = { workspace = true, default-features = true }
flate2 = { workspace = true }
globwalk = { workspace = true }
toml_edit = { workspace = true }
petgraph = { workspace = true }
#ptree = "~0.4"
rayon = { workspace = true }
semver = { workspace = true }
similar = { workspace = true }
regex = { workspace = true }
#sha-1 = "~0.10"
tar = { workspace = true }
handlebars = { workspace = true }
ureq = { workspace = true }
colored = { workspace = true }
duct = { workspace = true }
tracing = { workspace = true, features = [ "log-always" ], optional = true }
tracing-subscriber = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
prettytable-rs = { workspace = true }
serde_json = { workspace = true } # for CargoMetadata::Package::metadata (need serde_json::Value)
serde = { workspace = true } # for CargoMetadata::Package
parse-display = { workspace = true, default-features = true } # need because derive_tools don't reexport this correctly
walkdir = { workspace = true }
camino = { workspace = true } # UTF-8 paths (Utf8Path, Utf8PathBuf)
rustdoc-md = { workspace = true }
rustdoc-types = { workspace = true } # same minor as rustdoc-md's own dep — Crate type identity
assert_fs = { workspace = true }

## internal
# qqq : optimize features
crates_tools = { workspace = true }
error_tools = { workspace = true, features = [ "error_typed", "error_untyped" ] }
# direct edge required by thiserror 2 derive expansion (::thiserror absolute paths); error_tools stays the API facade
thiserror = { workspace = true }
genfile_core = { workspace = true, features = [ "enabled" ] }
former = { workspace = true, features = [ "default" ] }
component_model = { workspace = true, features = [ "default" ] }
itertools = { workspace = true, features = [ "use_std" ] }
mod_interface = { workspace = true, features = [ "default" ] }
wca = { workspace = true, features = [ "default" ] }
pth = { workspace = true, features = [ "default", "path_utf8", "path_unique_folder_name" ] }
process_tools = { workspace = true, features = [ "enabled" ] }
derive_tools = { workspace = true, features = [ "default" ] }  # derive_tools is a basic dependency required for compilation.
either = { workspace = true }
collection_tools = { workspace = true, features = [ "collection_constructors", "collection_into_constructors" ] }
macro_tools = { workspace = true, features = [ "default" ] }

[[example]]
name = "willbe_trivial"
required-features = [ "enabled" ]

[dev-dependencies]
test_tools = { workspace = true, features = [ "full" ] }
assert_fs = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
